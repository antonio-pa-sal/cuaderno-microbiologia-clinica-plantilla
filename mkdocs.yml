site_name: Cuadernos de prácticas FP
site_description: Cuadernos digitales de prácticas organizados por módulo
site_author: Centro educativo
theme:
  name: material
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
validation:
  links:
    # Las rutas de evidencias son marcadores que el alumnado completará después.
    not_found: ignore
nav:
  - Portada: index.md
  - Módulos:
      - Microbiología Clínica:
          - Cuaderno: modulos/microbiologia-clinica/index.md
          - Evidencias visuales: modulos/microbiologia-clinica/assets/README.md
          - Prácticas:
              - P01 · Inducción de bioseguridad, riesgos, EPI, residuos y trazabilidad: modulos/microbiologia-clinica/practicas-generadas/P01_Bioseguridad.md
              - P02 · Observación de agua estancada mediante preparación en fresco: modulos/microbiologia-clinica/practicas-generadas/P02_Observacion_en_fresco.md
              - P03 · Tinción vital con azul de metileno: modulos/microbiologia-clinica/practicas-generadas/P03_Azul_de_metileno.md
              - P04 · Tinción de Gram: modulos/microbiologia-clinica/practicas-generadas/P04_Tincion_de_Gram.md
              - P05 · Tinción de Ziehl-Neelsen: modulos/microbiologia-clinica/practicas-generadas/P05_Ziehl_Neelsen.md
              - P06 · Tinción de endosporas: modulos/microbiologia-clinica/practicas-generadas/P06_Tincion_de_endosporas.md
              - P07 · Elaboración de medio de cultivo líquido: modulos/microbiologia-clinica/practicas-generadas/P07_Medio_liquido.md
              - P08 · Recuperación de cultivos liofilizados: modulos/microbiologia-clinica/practicas-generadas/P08_Recuperacion_de_liofilizados.md
              - P09 · Elaboración de medio de cultivo sólido en placa: modulos/microbiologia-clinica/practicas-generadas/P09_Medio_solido_en_placa.md
